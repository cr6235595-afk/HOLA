name: android

on:
  workflow_dispatch:

  push:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/blockcraft-upload.jks

          cat > android/local.properties <<EOF
          keystore=blockcraft-upload.jks
          keystore.password=$KEYSTORE_PASSWORD
          key=$KEY_ALIAS
          key.password=$KEY_PASSWORD
          EOF

      - name: Build signed release APK and AAB
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease

      - name: Save signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: BlockCraft-release-APK-signed
          path: android/app/build/outputs/apk/release/*.apk

      - name: Save signed release AAB
        uses: actions/upload-artifact@v7
        with:
          name: BlockCraft-release-AAB-signed
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Clean signing files
        if: always()
        run: |
          rm -f android/app/blockcraft-upload.jks
          rm -f android/local.properties

